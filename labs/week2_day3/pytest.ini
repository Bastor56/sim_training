[pytest]
testpaths = tests
# The lab root, so tests can import the mcp_server package.
pythonpath = .
filterwarnings =
    # PyMuPDF's SWIG bindings trigger these on import under Python 3.12; not our code.
    ignore:builtin type Swig:DeprecationWarning
    ignore:builtin type swigvarlink:DeprecationWarning
