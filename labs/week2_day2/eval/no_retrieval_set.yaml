# Harbor Credit Union: questions where retrieving is the WRONG move (spec.md "Eval sets", decision 5).
# Every one should be answered by the gate's answer_direct path with 0 retrieval rounds, and
# the direct answer must not state any Harbor-specific fee, rate, limit or policy.
# Single-turn only: follow-ups like "rephrase that" need conversation memory (out of scope today).
version: 1
created: "2026-09-25"
queries:
  - id: "n001"
    query: "Hi there!"
    category: "greeting"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "Nothing to look up."
  - id: "n002"
    query: "Thanks, that's everything I needed."
    category: "closing"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "A sign-off, not a question."
  - id: "n003"
    query: "What kinds of questions can you help me with?"
    category: "capability"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "About the assistant itself. Answer in general terms (accounts, cards, loans, fees, policies), no specific numbers."
  - id: "n004"
    query: "Am I talking to a real person?"
    category: "identity"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "Must say plainly that it is an automated assistant."
  - id: "n005"
    query: "What is 15% of 240?"
    category: "arithmetic"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "36. Retrieval cannot help."
  - id: "n006"
    query: "What does APR stand for?"
    category: "general_definition"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "Deliberate edge case: defining the term is general knowledge, but Harbor's APR on a product would need retrieval. Expected answer defines 'annual percentage rate' and quotes no Harbor rate."
  - id: "n007"
    query: "How many days are there in a leap year?"
    category: "general_knowledge"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "366."
  - id: "n008"
    query: "Can you make this sound more polite: 'fix my card now'"
    category: "text_help"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "A rewrite of the member's own text; mentions a card but asks nothing about Harbor's card rules."
  - id: "n009"
    query: "What's a good recipe for pancakes?"
    category: "off_topic"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "Off-topic for a credit union: a polite one-line decline, no retrieval."
  - id: "n010"
    query: "Write me a two-line poem about autumn."
    category: "off_topic"
    tenant: "retail"
    expected_gate: "answer_direct"
    notes: "Off-topic: polite decline, no retrieval."
