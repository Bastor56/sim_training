    answer: "Five failed attempts; locked for 30 minutes."
    fact_ids: ["f030"]
    notes: "Avoids \"locked\", \"sign-in\", \"attempts\"."
  - id: "q012"
    query: "My car payment is running a bit behind. How many days do I have before it officially counts as behind?"
    type: "paraphrase"
    tenant: "retail"
