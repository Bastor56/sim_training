        quote: "not received within 15 calendar days after the due date"
        match: "substring"
    answer: "15 calendar days after the due date."
    fact_ids: ["f034"]
    notes: "Avoids \"late\", \"grace period\", \"loan\"."
  - id: "q013"
    query: "After I send in a formal gripe, how soon should I hear back from you?"
    type: "paraphrase"
    tenant: "retail"
    expected:
      - doc_id: "complaint_email_export"
        quote: "acknowledge every formal complaint within 2 business days"
        match: "substring"
    answer: "Within 2 business days (resolution targeted within 15 business days)."
    fact_ids: ["f039"]
    notes: "Avoids \"complaint\" and \"acknowledge\"."
  - id: "q014"
    query: "I misplaced my card. How long until the new one shows up in the post?"
    type: "paraphrase"
    tenant: "retail"
    expected:
      - doc_id: "lost_stolen_card_script"
        quote: "a replacement card typically arrives within 7 to 10 business days"
        match: "substring"
    answer: "7 to 10 business days by standard mail."
    fact_ids: ["f036"]
    notes: "Avoids \"replacement\", \"lost\", \"arrives\"."
  - id: "q015"
    query: "If I shut down my membership and there's money left over, how do I get it?"
    type: "paraphrase"
    tenant: "retail"
    expected:
      - doc_id: "account_closure_procedure"
        quote: "the remaining balance is disbursed by official check mailed within 7 business days to the address on file"
        match: "substring"
    answer: "By official check mailed within 7 business days to the address on file."
    fact_ids: ["f035"]
    notes: "Avoids \"close\", \"balance\", \"disburse\". The raw DOCX has a \"[DELETED: within 10 business days]\" fragment inside this sentence; the quote only matches once it is removed."
  - id: "q016"
    query: "How much does a stop payment order cost?"
    type: "scanned_table"
    tenant: "retail"
