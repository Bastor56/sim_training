    answer: "Block the card in CardCenter, transfer to the Fraud Response Team at ext. 4417, and tell the member the replacement arrives in 7 to 10 business days."
    fact_ids: ["f037", "f036"]
    notes: "Steps 2, 4 and 6 of the script."
