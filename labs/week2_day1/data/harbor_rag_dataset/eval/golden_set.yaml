# Harbor Credit Union retrieval golden set. Expected answers are doc_id + verbatim quote, never chunk IDs.
# access: restricted marks a query whose only answer lives in a restricted document (exclude it, or expect [], in member-facing runs).
# Where a quote exists in a document and its duplicate/near-duplicate, every location is listed and any one counts as a hit.
version: 1
created: "2026-09-23"
corpus_version: 1
match_rules:
  normalisation: "lowercase, collapse all whitespace to single spaces, normalise unicode quotes/dashes to ASCII"
  substring: "chunk text contains the quote after normalisation"
  all_tokens: "every token in the quote appears in the same chunk after normalisation (use for table rows and figures)"
queries:
  - id: "q001"
    query: "When does an agent complete Form HCU-DSP-114?"
    type: "exact_term"
    tenant: "retail"
    expected:
      - doc_id: "card_dispute_procedure"
        quote: "completes Form HCU-DSP-114 (Card Transaction Dispute) during the initial contact"
        match: "substring"
    answer: "During the initial contact, for every card dispute."
    fact_ids: ["f007"]
    notes: "Distinctive form number."
  - id: "q002"
    query: "What Earnings Credit Rate (ECR) does Business Analysis Checking earn?"
    type: "exact_term"
    tenant: "business"
    expected:
      - doc_id: "business_fee_guide"
        quote: "earn an Earnings Credit Rate (ECR) of 0.35%"
        match: "substring"
    answer: "0.35%."
    fact_ids: ["f043"]
    notes: "Business-tenant target; run with tenant=business."
  - id: "q003"
    query: "What triggers Velocity Rule VR-3?"
    type: "exact_term"
    tenant: "retail"
    access: "restricted"
    expected:
      - doc_id: "fraud_monitoring_thresholds"
        quote: "Velocity Rule VR-3 triggers when a single debit card has more than six (6) card-not-present authorizations within 30 minutes"
        match: "substring"
    answer: "More than six card-not-present authorizations on one debit card within 30 minutes."
    fact_ids: ["f044"]
    notes: "Restricted document. Only answerable with restricted clearance; a member-facing run must return nothing from this doc."
  - id: "q004"
    query: "Who has to sign Form HCU-ACL-220?"
    type: "exact_term"
    tenant: "retail"
    expected:
      - doc_id: "account_closure_procedure"
        quote: "Obtain a signed Form HCU-ACL-220 (Account Closure Request) from every owner on the account"
        match: "substring"
    answer: "Every owner on the account."
    fact_ids: ["f035"]
    notes: "Quote sits in a Word table cell."
  - id: "q005"
    query: "What minimum daily balance must a Primary Share Account keep to earn dividends?"
    type: "exact_term"
    tenant: "retail"
    expected:
      - doc_id: "savings_terms"
        quote: "maintain a minimum daily balance of $100 in your Primary Share Account to earn dividends"
        match: "substring"
    answer: "$100."
    fact_ids: ["f040"]
    notes: "Defined term in the RTF terms and conditions."
  - id: "q006"
    query: "What is the early withdrawal penalty on a Share Certificate with a term longer than 12 months?"
    type: "exact_term"
    tenant: "retail"
    expected:
      - doc_id: "share_certificate_disclosure"
        quote: "For certificates with terms longer than 12 months, a penalty equal to 180 days of dividends applies"
        match: "substring"
    answer: "180 days of dividends."
    fact_ids: ["f045"]
    notes: "Distractor: 90 days for terms of 12 months or less."
  - id: "q007"
    query: "How long do I have to tell you about a charge on my card that I don't recognise?"
    type: "paraphrase"
    tenant: "retail"
    expected:
      - doc_id: "card_dispute_procedure"
        quote: "within 60 days of the statement date on which the transaction first appeared"
        match: "substring"
    answer: "Within 60 days of the statement date on which it first appeared."
    fact_ids: ["f005"]
    notes: "Avoids \"dispute\", \"report\", \"statement\"."
  - id: "q008"
    query: "If I'm fighting a charge, how fast do I get money put back while you look into it?"
    type: "paraphrase"
    tenant: "retail"
    expected:
      - doc_id: "card_dispute_procedure"
        quote: "Provisional credit for the disputed amount is posted within 10 business days"
        match: "substring"
    answer: "Within 10 business days of Harbor receiving the notice."
    fact_ids: ["f006"]
    notes: "Avoids \"provisional credit\" and \"dispute\"."
  - id: "q009"
    query: "What's the latest time of day I can send money to another bank and have it go out today?"
    type: "paraphrase"
    tenant: "retail"
    expected:
      - doc_id: "wire_transfer_policy"
        quote: "received and verified by 3:00 p.m. Eastern Time on a business day"
        match: "substring"
      - doc_id: "wire_transfer_policy_copy"
        quote: "received and verified by 3:00 p.m. Eastern Time on a business day"
        match: "substring"
    answer: "3:00 p.m. Eastern Time on a business day (domestic)."
    fact_ids: ["f011"]
    notes: "Avoids \"wire\" and \"cutoff\". Both wire copies listed because the quote exists in the near-duplicate."
  - id: "q010"
    query: "How much can I add each day by snapping photos of cheques with my phone?"
    type: "paraphrase"
    tenant: "retail"
    expected:
      - doc_id: "online_banking_help"
        quote: "The standard daily limit for mobile check deposit is $5,000"
        match: "substring"
    answer: "$5,000 per day."
    fact_ids: ["f029"]
    notes: "Avoids \"mobile deposit\" and \"limit\"."
  - id: "q011"
    query: "I keep typing my password wrong. How many tries before I'm shut out, and for how long?"
    type: "paraphrase"
    tenant: "retail"
    expected:
