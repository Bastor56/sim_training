  - id: "q032"
    query: "Walk me through the card dispute process: what form is used, when is provisional credit given, how long can the investigation take, and when is the member told the outcome?"
    type: "multi_chunk"
    tenant: "retail"
    expected:
      - doc_id: "card_dispute_procedure"
        quote: "completes Form HCU-DSP-114 (Card Transaction Dispute) during the initial contact"
        match: "substring"
      - doc_id: "card_dispute_procedure"
        quote: "Provisional credit for the disputed amount is posted within 10 business days"
        match: "substring"
      - doc_id: "card_dispute_procedure"
        quote: "must be completed within 45 calendar days of receiving the dispute notice"
        match: "substring"
      - doc_id: "card_dispute_procedure"
        quote: "notifies the member in writing within 3 business days of completing the investigation"
        match: "substring"
    answer: "Form HCU-DSP-114 at first contact; provisional credit within 10 business days; investigation within 45 calendar days (90 for some); written notice within 3 business days of completion."
    fact_ids: ["f007", "f006", "f008"]
    notes: "Four passages from sections 2, 4, 5 and 6."
  - id: "q033"
    query: "What are the key steps and timelines for closing a member's account?"
    type: "multi_chunk"
    tenant: "retail"
    expected:
      - doc_id: "account_closure_procedure"
        quote: "Obtain a signed Form HCU-ACL-220 (Account Closure Request) from every owner on the account"
        match: "substring"
      - doc_id: "account_closure_procedure"
        quote: "placed in Closing status for a 30-day review period before final disbursement"
        match: "substring"
      - doc_id: "account_closure_procedure"
        quote: "the remaining balance is disbursed by official check mailed within 7 business days to the address on file"
        match: "substring"
    answer: "Signed Form HCU-ACL-220 from every owner; 30-day review if items are pending; balance mailed by official check within 7 business days."
    fact_ids: ["f035"]
    notes: "Table row plus sections 4 and 5."
  - id: "q034"
    query: "On a lost-card call where the member reports unauthorized transactions, what must the agent do and what should the member be told about the new card?"
